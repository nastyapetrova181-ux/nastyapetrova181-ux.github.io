    <path d="M332 274h236" stroke="#F7FDFF" stroke-width="9" stroke-linecap="round" opacity=".7"/>
    <path d="M350 392h200" stroke="#07101C" stroke-width="14" stroke-linecap="round" opacity=".8"/>
    <circle cx="388" cy="344" r="17" fill="#07101C"/>
