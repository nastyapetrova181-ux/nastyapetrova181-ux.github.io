<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Станция — персонаж-монитор</title>
  <desc id="desc">Альтернативный маскот для бренда сборки ПК: персонаж с головой-монитором и инструментами, без прежней формы знака.</desc>
  <defs>
    <linearGradient id="screen" x1="284" y1="210" x2="616" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9F7FF"/>
      <stop offset=".45" stop-color="#2E95FF"/>
      <stop offset="1" stop-color="#745CFF"/>
    </linearGradient>
    <linearGradient id="metal" x1="230" y1="122" x2="706" y2="768" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F5FA"/>
      <stop offset=".48" stop-color="#7E8BA1"/>
      <stop offset="1" stop-color="#202839"/>
    </linearGradient>
    <filter id="blueGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .13 0 0 0 0 .48 0 0 0 0 1 0 0 0 .56 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000" flood-opacity=".62"/>
    </filter>
  </defs>

  <rect width="900" height="900" rx="112" fill="#05070D"/>
